@for (option of options(); track option.value) {
  <button
    type="button"
    class="chip"
    role="radio"
    [class.chip--active]="option.value === value()"
    [attr.aria-checked]="option.value === value()"
    [disabled]="disabled()"
    (click)="select(option.value)"
  >
    {{ option.label }}
  </button>
}
