<header class="shell__header">
  <span class="shell__title">Мои траты</span>
  @if (!network.online()) {
    <span class="badge badge--warning">Офлайн</span>
  }
  @if (reminder.supported()) {
    <button
      type="button"
      class="shell__reminder"
      [class.shell__reminder--on]="reminder.enabled()"
      [attr.aria-pressed]="reminder.enabled()"
      [disabled]="reminder.busy()"
      aria-label="Напоминание в 23:00, если за день нет трат"
      (click)="toggleReminder()"
    >
      <svg class="shell__reminder-icon" viewBox="0 0 24 24" aria-hidden="true">
        @if (reminder.enabled()) {
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" />
        } @else {
          <path
            d="M13.73 21a2 2 0 0 1-3.46 0M18.63 13A17.9 17.9 0 0 1 18 8M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.33-5M2 2l20 20"
          />
        }
      </svg>
    </button>
  }
</header>

<main class="shell__content">
  <router-outlet />
</main>

<app-bottom-nav />
